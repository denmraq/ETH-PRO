<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETH ML Predictor Radar</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:20px;display:flex;justify-content:center}
.container{max-width:500px;width:100%}
h1{text-align:center;color:#38bdf8;font-size:1.5rem}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #334155}
.horizon-title{font-weight:bold;color:#94a3b8;margin-bottom:8px;font-size:.9rem;text-transform:uppercase}
.val{font-size:1.4rem;font-weight:bold}.LONG{color:#4ade80}.SHORT{color:#f87171}.NEUTRAL{color:#fbbf24}
.details{font-size:.85rem;color:#94a3b8;margin-top:4px}
.status{font-size:.8rem;color:#94a3b8;text-align:center;margin-bottom:12px}
button{width:100%;background:#0284c7;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>ETH ML Market Radar</h1>
<div id="modelStatus" class="status">Проверка модели...</div>
<div id="content">Загрузка прогнозов...</div>
<button onclick="loadPredictions()">Обновить данные</button>
</div>
<script>
async function loadPredictions(){
 const container=document.getElementById('content');
 const modelStatus=document.getElementById('modelStatus');
 try{
   const res=await fetch('/api/v1/predict',{cache:'no-store'});
   const data=await res.json();

   if(data.status==='error'){
      container.innerHTML=`<div class="card">Ошибка: ${data.message}</div>`;
      return;
   }

   modelStatus.textContent=data.model_loaded
      ? 'CatBoost-модель загружена'
      : 'CatBoost-модель не загружена: 12ч = 50%';

   const card=(title,h)=>`
      <div class="card">
        <div class="horizon-title">${title}</div>
        <div class="val ${h.direction}">${h.direction}</div>
        <div class="details">
          Вероятность роста: <b>${h.probability_up}%</b> |
          Уверенность: <b>${h.confidence}%</b>
        </div>
      </div>`;

   container.innerHTML=
      card('Прогноз на 1 час',data.horizon_1h)+
      card('Прогноз на 12 часов (CatBoost)',data.horizon_12h)+
      card('Прогноз на 24 часа',data.horizon_24h);

 }catch(err){
   container.innerHTML='<div class="card">Ошибка соединения с сервером</div>';
 }
}
loadPredictions();
</script>
</body>
</html>
