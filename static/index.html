<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETH Predictive Engine</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f19;color:#eef2f7;margin:0;padding:18px}
.wrap{max-width:520px;margin:auto}.card{background:#151e2e;border:1px solid #29364e;border-radius:16px;padding:17px;margin:12px 0}
h1{color:#55b8ef;font-size:24px}.LONG,.BULLISH{color:#52d273}.SHORT,.BEARISH{color:#ff625f}.NEUTRAL{color:#f6c44f}
.big{font-size:34px;font-weight:900}.small{color:#97a4b9;line-height:1.5}.bar{height:9px;background:#26334a;border-radius:10px;overflow:hidden}.fill{height:100%;background:#7fa7ff}
.news{padding:10px 0;border-top:1px solid #26334a}.news a{color:#e8edf5;text-decoration:none;font-weight:650}
button{width:100%;padding:14px;background:#318bd0;color:white;border:0;border-radius:10px;font-size:17px;font-weight:800}
</style></head><body><div class="wrap">
<h1>ETH RADAR V2</h1><div id="health" class="small">Загрузка...</div>
<div id="pred"></div>
<div class="card"><b>WHALE FLOW</b><div id="whales" class="small">...</div></div>
<div class="card"><b>Проверка модели (Walk-Forward)</b><div id="val" class="small">...</div></div>
<div class="card"><b>Новости ETH — на русском</b><div id="news"></div></div>
<button onclick="loadAll()">Обновить</button>
</div>
<script>
function card(name,h){
 let ci=h.confidence_interval_pct;
 return `<div class="card"><div class="small">${name}</div><div class="big ${h.direction}">${h.direction}</div>
 <div>Модельная вероятность: <b>${h.probability}%</b></div>
 <div class="small">Ожидаемый возврат: ${h.expected_return_pct}% · 95% интервал: ${ci[0]}% … ${ci[1]}%</div>
 <div class="small">SL ${h.risk.stop_loss} · TP ${h.risk.take_profit} · Kelly ${(h.risk.kelly_fraction*100).toFixed(1)}% ${h.risk.kill_switch?'· KILL-SWITCH':''}</div></div>`
}
async function loadAll(){
 const p=await fetch('/api/v2/predict',{cache:'no-store'}).then(r=>r.json());
 document.getElementById('health').innerHTML=`Цена ${p.price} · OKX · OFI ${p.features.ofi} · Funding ${p.features.funding_rate}`;
 document.getElementById('pred').innerHTML=card('1 ЧАС',p.horizon_1h)+card('12 ЧАСОВ',p.horizon_12h)+card('24 ЧАСА',p.horizon_24h);

 const w=await fetch('/api/v2/whales',{cache:'no-store'}).then(r=>r.json());
 if(w.status==='ok'){
   const order=['15m','1h','4h','12h'];
   document.getElementById('whales').innerHTML=order.map(k=>{
      const x=w.windows[k];
      const cls=x.signal==='ACCUMULATION'?'BULLISH':(x.signal==='EXCHANGE_INFLOW'?'BEARISH':'NEUTRAL');
      const ru=x.signal==='ACCUMULATION'?'НАКОПЛЕНИЕ':(x.signal==='EXCHANGE_INFLOW'?'ПРИТОК НА БИРЖИ':'НЕЙТРАЛЬНО');
      return `<div class="news"><b>${k}</b> · <span class="${cls}">${ru}</span><br>
      In ${x.inflow_eth} ETH · Out ${x.outflow_eth} ETH · Net ${x.netflow_eth} ETH · событий ${x.events}</div>`;
   }).join('');
 } else {
   document.getElementById('whales').innerHTML=w.message || 'Whale Engine не настроен';
 }

 const v=await fetch('/api/v2/validation',{cache:'no-store'}).then(r=>r.json());
 document.getElementById('val').innerHTML=v.overall_accuracy?`Accuracy ${(v.overall_accuracy*100).toFixed(1)}% · Brier ${v.overall_brier.toFixed(3)} · ${v.rows} строк`:'Модель ещё обучается';
 const n=await fetch('/api/v2/news',{cache:'no-store'}).then(r=>r.json());
 document.getElementById('news').innerHTML=n.articles.map(x=>`<div class="news"><a target="_blank" href="${x.link}">${x.title}</a><div class="small ${x.sentiment}">${x.sentiment}</div></div>`).join('');
}
loadAll();
</script></body></html>
