services:
  - type: web
    name: eth-entry-radar-pro
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENABLE_MONITOR
        value: 1
      - key: MONITOR_INTERVAL_SECONDS
        value: 60
      - key: DATA_DIR
        value: /var/data
    disk:
      name: radar-pro-data
      mountPath: /var/data
      sizeGB: 1
