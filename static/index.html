<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>ETH Binary Radar Engine</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 480px; width: 100%; }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .status {
            text-align: center;
            color: #64748b;
            font-size: 0.82rem;
            margin: 0 0 14px;
            line-height: 1.45;
        }
        .card {
            background: #151e2e;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid #24334a;
        }
        .horizon-title {
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .val {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .LONG { color: #22c55e; }
        .SHORT { color: #ef4444; }
        .details {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 6px;
            line-height: 1.45;
        }
        .note {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 8px;
        }
        .news-summary {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 12px;
            line-height: 1.45;
        }
        .news-item {
            padding: 11px 0;
            border-top: 1px solid #24334a;
        }
        .news-title {
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.35;
            text-decoration: none;
            font-weight: 650;
        }
        .news-meta {
            margin-top: 5px;
            color: #64748b;
            font-size: 0.76rem;
        }
        .BULLISH { color: #22c55e; }
        .BEARISH { color: #ef4444; }
        .NEUTRAL { color: #f59e0b; }

        button {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ETH RADAR: LONG / SHORT</h1>
        <div id="status" class="status">Проверка модели...</div>
        <div id="content">Получение сигналов...</div>

        <div class="card news-card">
            <div class="horizon-title">ETH NEWS ENGINE</div>
            <div id="news-summary" class="news-summary">Получение свежих новостей...</div>
            <div id="news-list"></div>
        </div>

        <button onclick="refreshAll()">Обновить Радар</button>
    </div>

    <script>
        async function loadPredictions() {
            const container = document.getElementById('content');
            const status = document.getElementById('status');

            try {
                const res = await fetch('/api/v1/predict', { cache: 'no-store' });
                const data = await res.json();

                if (data.status === 'error') {
                    container.innerHTML = `<div class="card">Ошибка: ${data.message}</div>`;
                    return;
                }

                const modelText = data.model_loaded
                    ? 'CatBoost-модель активна'
                    : (data.model_training ? 'CatBoost обучается...' : 'CatBoost пока не загружен');

                status.innerHTML = `${modelText}<br>Signal Stabilizer: <b>активен</b>`;

                const renderCard = (title, h, note) => `
                    <div class="card">
                        <div class="horizon-title">${title}</div>
                        <div class="val ${h.direction}">${h.direction}</div>
                        <div class="details">
                            Вероятность исхода: <b>${h.probability}%</b> |
                            Сила сигнала: <b>${h.confidence}%</b>
                        </div>
                        <div class="note">${note}</div>
                    </div>
                `;

                container.innerHTML =
                    renderCard(
                        'Прогноз 1 Час',
                        data.horizon_1h,
                        'Смена только после 2 подтверждений на разных закрытых 15m свечах.'
                    ) +
                    renderCard(
                        'Прогноз 12 Часов',
                        data.horizon_12h,
                        'Пересчет только после закрытия новой 1H свечи.'
                    ) +
                    renderCard(
                        'Прогноз 24 Часа',
                        data.horizon_24h,
                        'Пересчет только после закрытия новой 1H свечи.'
                    );

            } catch (err) {
                container.innerHTML = `<div class="card">Ошибка соединения с сервером</div>`;
            }
        }

        async function loadNews() {
            const summary = document.getElementById('news-summary');
            const list = document.getElementById('news-list');

            try {
                const res = await fetch('/api/v1/news', { cache: 'no-store' });
                const data = await res.json();

                if (data.status !== 'ok') {
                    summary.textContent = `Новости временно недоступны: ${data.message}`;
                    list.innerHTML = '';
                    return;
                }

                summary.innerHTML =
                    `Фон: <b class="${data.overall}">${data.overall}</b> · ` +
                    `🟢 ${data.bullish} · 🔴 ${data.bearish} · 🟡 ${data.neutral}`;

                list.innerHTML = data.articles.map(n => {
                    let dt = '';
                    if (n.published) {
                        try {
                            dt = new Date(n.published).toLocaleString('ru-RU', {
                                day: '2-digit', month: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        } catch(e) {}
                    }

                    const safeLink = n.link || '#';
                    return `
                        <div class="news-item">
                            <a class="news-title" href="${safeLink}" target="_blank" rel="noopener noreferrer">${n.title}</a>
                            <div class="news-meta">
                                <span class="${n.sentiment}">${n.sentiment}</span>
                                · влияние ${n.impact}% ${dt ? '· ' + dt : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                summary.textContent = 'Новости временно недоступны';
                list.innerHTML = '';
            }
        }

        async function refreshAll() {
            await Promise.all([loadPredictions(), loadNews()]);
        }

        refreshAll();
    </script>
</body>
</html>
